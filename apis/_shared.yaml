    WebThumbnails:
      type: object
      description: Web API 列表接口按类型归组的作品数据（键为作品 ID 的 map 或数组，随端点而异）
      properties:
        illust:
          type: array
          items:
            $ref: '#/components/schemas/WebIllustItem'
        novel:
