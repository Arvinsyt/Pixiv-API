# 私信接口 · Web（www.pixiv.net AJAX / RPC）
openapi: 3.0.3
info:
  title: Pixiv Web API - Message
  version: 1.0.0
  description: |
    Pixiv Web 站（www.pixiv.net）私信（メッセージ）相关的 AJAX / RPC 接口，
    完整收录开源实现中
    出现的全部端点：能否私信检查、会话列表与未读数。
    App API 无任何私信能力，私信只能走 Web。

    `/rpc/index.php` 是多用途 RPC 分发端点：GET 形式（查询参数）与
    POST 形式（JSON 体）并存，mode 决定功能——除私信的
    latest_message_threads2 / message_thread_unread_count 外，
    mode=following_user_restrict_change（关注公开/私密切换，功能上属
    `user-web.yaml`）也走此端点。

    鉴权（Cookie）、响应信封（`{error, message, body}`）与通用 `lang`
    参数见 `_shared.yaml` 的 Web API 约定。
servers:
  - url: https://www.pixiv.net
    description: Pixiv Web 站
tags:
  - name: message-web
    description: 私信查询接口（会话列表、未读数、可发送检查）
  - name: message-web-rpc
    description: rpc 多用途分发端点（GET / POST 两种形式）
paths:
  /ajax/message/can_send/{userId}:
    get:
      operationId: webMessageCanSend
      summary: 能否给该用户发私信
      description: |
        检查当前登录用户能否给指定用户发私信
        （对方关闭私信或已被屏蔽时为 false）。需要登录 Cookie。
      tags: [message-web]
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: 目标用户 ID
          schema:
            type: integer
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          can_send:
                            type: boolean
                        additionalProperties: true
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'

  /rpc/index.php:
    get:
      operationId: webRpcMessageThreads
      summary: 私信会话列表（GET 形式）
      description: |
        网页版私信（メッセージ）的会话列表，mode=latest_message_threads2。
        App API 无任何私信能力。需要登录 Cookie；响应内业务字段
        （message_threads 等）以实际响应为准。
      tags: [message-web]
      security:
        - cookieAuth: []
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
          enum: [latest_message_threads2]
        - name: num
          in: query
          required: false
          description: 拉取数量
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 会话列表（error=false 时 body 含 message_threads）
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'

    post:
      operationId: webRpcIndex
      summary: rpc 多用途分发（POST 形式）
      description: |
        参考实现以 POST + JSON 体调用同一 `/rpc/index.php`，mode 决定功能：

        - `latest_message_threads2`：私信会话列表（num 为拉取数量）；
        - `message_thread_unread_count`：私信未读数；
        - `following_user_restrict_change`：把对某用户的关注切换为
          公开/私密（user_id + restrict，restrict 为 0/1），功能说明见
          `user-web.yaml`。

        需要登录 Cookie 与 CSRF token。
      tags: [message-web-rpc]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/WebCsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [latest_message_threads2, message_thread_unread_count,
                         following_user_restrict_change]
                  description: RPC 功能标识
                num:
                  type: integer
                  description: mode=latest_message_threads2 时的拉取数量
                user_id:
                  type: string
                  description: mode=following_user_restrict_change 时的目标用户 ID
                restrict:
                  type: integer
                  enum: [0, 1]
                  description: mode=following_user_restrict_change 时的目标可见性（0=公开，1=私密）
      responses:
        '200':
          description: 分发结果（body 结构随 mode 而异）
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
        '400':
          description: 参数缺失或 CSRF token 无效
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
