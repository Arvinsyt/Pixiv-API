# 用户接口（app-api.pixiv.net）
openapi: 3.0.3
info:
  title: Pixiv App API - User
  version: 1.0.0
  description: |
    用户相关接口（用户详情、作品、粉丝/关注、关注操作、账号设置），

    用户的收藏列表与收藏标签见 bookmark.yaml。
    认证方式与公共请求头约定见 `_shared.yaml` 顶部说明。
servers:
  - url: https://app-api.pixiv.net
    description: Pixiv App API
tags:
  - name: user
    description: 用户详情与作品
  - name: follow
    description: 关注关系（关注/取关/粉丝/关注中）
  - name: settings
    description: 当前用户的内容展示设置
  - name: profile-edit
    description: 资料编辑（表单预设、个人资料、工作环境）
paths:
  /v1/user/me/state:
    get:
      operationId: getUserMeState
      summary: 当前登录账号的状态
      description: |
        返回当前令牌对应账号的状态信息。
        具体字段未经完整确认（不同版本客户端返回内容有差异），如实从简记录。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      responses:
        '200':
          description: 账号状态（字段以实际响应为准）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/detail:
    get:
      operationId: getUser
      summary: 用户详情
      description: |
        请求时固定携带 `filter=for_android`。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserDetailResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v2/user/detail:
    get:
      operationId: getUserV2
      summary: 用户详情（v2）
      description: |
        与 `/v1/user/detail` 结构一致，新增 `disabled_links` 字段
        （被服务端禁用的外链标识列表）。当前官方客户端实际使用 v2。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [for_ios, for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserDetailV2Response'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/request-plans:
    get:
      operationId: getUserRequestPlans
      summary: 画师的约稿方案列表
      description: |
        画师开启「接受约稿」（is_accept_request）时返回其公开的约稿方案
        （价格、可接受类型、说明与封面）。单页返回，无 next_url。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 约稿方案列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserRequestPlansResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/recommended:
    get:
      operationId: getUserRecommended
      summary: 推荐用户
      description: 请求时固定携带 `filter=for_android`。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 推荐用户列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserPreviewsResponse'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/related:
    get:
      operationId: getUserRelated
      summary: 相关用户
      description: |
        请求时固定携带 `filter=for_android`。
        返回与指定用户相关的其他用户（如"经常一起出现的画师"）。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - name: seed_user_id
          in: query
          required: true
          description: 种子用户 ID
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 相关用户列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserPreviewsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/illusts:
    get:
      operationId: getUserIllusts
      summary: 用户的作品（插画/漫画）
      description: |
        请求时固定携带 `filter=for_android`。type=manga 时返回漫画。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
        - name: type
          in: query
          required: true
          description: 作品类型
          schema:
            type: string
            enum: [illust, manga]
        - $ref: '_shared.yaml#/components/parameters/Offset'
      responses:
        '200':
          description: 用户作品列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/IllustsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/novels:
    get:
      operationId: getUserNovels
      summary: 用户的小说
      description: 请求时固定携带 `filter=for_android`。
      tags: [user]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 用户小说列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/NovelsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/follower:
    get:
      operationId: getFollowUser
      summary: 用户的粉丝
      description: |
        请求时固定携带 `filter=for_android`。
        注意：客户端会传 restrict 参数，但本接口实际仅按 user_id 返回粉丝列表。
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
        - name: restrict
          in: query
          required: false
          schema:
            type: string
          description: 客户端会传此参数，服务端忽略
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 粉丝列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserPreviewsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/mypixiv:
    get:
      operationId: getUserMypixiv
      summary: 用户的好 P 友
      description: |
        某用户的好 P 友（mypixiv，互关好友）列表。
        请求时固定携带 `filter=for_android`。
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 好 P 友列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserPreviewsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/following:
    get:
      operationId: getUserFollowing
      summary: 用户关注的人
      description: |
        请求时固定携带 `filter=for_android`。
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [for_android]
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
        - name: restrict
          in: query
          required: true
          description: 关注类型（公开关注/悄悄关注）
          schema:
            type: string
            enum: [public, private]
            default: public
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 关注列表
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/UserPreviewsResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/follow/add:
    post:
      operationId: postFollowUser
      summary: 关注用户
      description: |
        restrict 传空字符串时省略该参数。
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                restrict:
                  type: string
                  enum: [public, private]
                  default: public
                  description: public 公开关注；private 悄悄关注
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/follow/delete:
    post:
      operationId: postUnFollowUser
      summary: 取消关注用户
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
                restrict:
                  type: string
                  enum: [public, private]
                  default: public
                  description: 客户端固定传 public（与 follow/add 对称）
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/follow/detail:
    get:
      operationId: getUserFollowDetail
      summary: 关注状态详情
      description: |
        查询当前登录用户对指定用户的关注状态
        （是否已关注、公开关注还是悄悄关注）。
      tags: [follow]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
        - $ref: '_shared.yaml#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: 关注状态
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/FollowDetailResponse'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'

  /v1/user/ai-show-settings:
    get:
      operationId: getUserAISettings
      summary: 查询 AI 作品展示设置
      tags: [settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      responses:
        '200':
          description: AI 作品展示设置
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/ShowAIResponse'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/ai-show-settings/edit:
    post:
      operationId: postUserAIShowSettings
      summary: 修改 AI 作品展示设置
      tags: [settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [show_ai]
              properties:
                show_ai:
                  type: boolean
                  description: 是否展示 AI 生成作品
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/restricted-mode-settings:
    get:
      operationId: userRestrictedModeSettingsGet
      summary: 查询受限模式（R-18 过滤）设置
      tags: [settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      responses:
        '200':
          description: 受限模式状态
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/RestrictedModeResponse'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
    post:
      operationId: userRestrictedModeSettings
      summary: 修改受限模式（R-18 过滤）设置
      tags: [settings]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [is_restricted_mode_enabled]
              properties:
                is_restricted_mode_enabled:
                  type: boolean
                  description: 是否开启受限模式
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/profile/presets:
    get:
      operationId: getUserProfilePresets
      summary: 资料编辑表单的预设选项
      description: |
        返回资料编辑页所需的地区/国家/职业候选列表与默认头像 URL，
        供 `POST /v1/user/profile/edit` 前渲染表单。
      tags: [profile-edit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      responses:
        '200':
          description: 预设选项
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/ProfilePresetsResponse'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/profile/edit:
    post:
      operationId: postUserProfileEdit
      summary: 修改个人资料
      description: |
        multipart 表单提交。只传需要修改的字段（如头像图片文件、
        地区/职业等，字段名与表单控件对应），未传的字段保持不变。
      tags: [profile-edit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: |
                待修改的资料字段（文本字段与头像图片文件 part 混合），
                只传需要修改的项，未传的字段保持不变。
                已知字段：profile_image（头像图片文件）、gender、address、
                country、job、user_name、webpage、twitter、comment、birthday。
              additionalProperties: true
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'

  /v1/user/workspace/edit:
    post:
      operationId: postUserWorkspaceEdit
      summary: 修改工作环境
      description: |
        提交工作环境（桌面/绘画工具等）字段，字段名与 Workspace
        结构一致（pc、monitor、tool、scanner、tablet、mouse、printer、
        desktop、music、desk、chair、comment 等），只传要改的项。
      tags: [profile-edit]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '_shared.yaml#/components/parameters/ClientTime'
        - $ref: '_shared.yaml#/components/parameters/ClientHash'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: 工作环境字段（键名见 Workspace schema），只传要修改的项
              additionalProperties:
                type: string
      responses:
        '200':
          $ref: '_shared.yaml#/components/responses/EmptyBody'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth2 Bearer 令牌，通过 oauth.secure.pixiv.net /auth/token 获取（见 auth.yaml）
