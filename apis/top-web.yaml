# 首页与发现接口 · Web（www.pixiv.net AJAX / RPC）
openapi: 3.0.3
info:
  title: Pixiv Web API - Top
  version: 1.0.0
  description: |
    Pixiv Web 站（www.pixiv.net）首页（Top）、排行（ranking）、发现（discovery）、
    关注新作（follow_latest）、好 P 友新作（mypixiv_latest）与活动入口（user_event）
    相关的 AJAX / RPC 接口，完整收录开源实现中出现的全部端点。App API 的推荐流不出 R-18，
    mode=r18 的推荐区与官网发现页只能从这里拿。

    鉴权（Cookie）、响应信封（`{error, message, body}`）与通用 `lang`
    参数见 `_shared.yaml` 的 Web API 约定。
servers:
  - url: https://www.pixiv.net
    description: Pixiv Web 站
tags:
  - name: top-web
    description: 首页、排行、发现与关注新作
paths:
  /ajax/top/{type}:
    get:
      operationId: webTop
      summary: 官网首页推荐区
      description: |
        官网首页（トップページ）的推荐区数据。App API 的推荐流不出 R-18，
        mode=r18 的推荐区只能从这里拿。必须带网页登录 Cookie，
        匿名请求返回 400。
      tags: [top-web]
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: 推荐区类型
          schema:
            type: string
            enum: [illust, manga, novel]
        - name: mode
          in: query
          required: true
          description: 内容分级
          schema:
            type: string
            enum: [all, r18]
        - $ref: '_shared.yaml#/components/parameters/WebLangQuery'
      responses:
        '200':
          description: 首页推荐区
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          page:
                            type: object
                            description: 各区块只给作品 ID 数组，作品本体在 thumbnails 中按 ID 取回
                            additionalProperties: true
                          thumbnails:
                            type: object
                            description: 作品缩略图数据（illust/novel 字段为精简作品集合）
                            additionalProperties: true
                        additionalProperties: true
        '400':
          description: 未登录或参数错误
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'

  /ranking.php:
    get:
      operationId: webRanking
      summary: 排行榜（旧版 ranking.php）
      description: |
        旧版排行榜端点，format=json 时返回 JSON。与 App API 的
        `/v1/illust/ranking`、`/v1/novel/ranking` 能力对应，
        但同一端点内以 content 参数区分插画/漫画/动图（无小说榜）。
        旧版 PHP 端点，响应不走 AJAX 信封，直接返回业务 JSON。
      tags: [top-web]
      security: []
      parameters:
        - name: format
          in: query
          required: true
          description: 固定 json
          schema:
            type: string
            enum: [json]
        - name: mode
          in: query
          required: false
          description: 榜单类型
          schema:
            type: string
            enum: [all, daily, weekly, monthly, rookie, original, daily_ai,
                   male, female, daily_r18, weekly_r18, male_r18, female_r18,
                   r18g]
            default: daily
        - name: content
          in: query
          required: false
          description: 作品类型
          schema:
            type: string
            enum: [all, illust, manga, ugoira]
        - name: date
          in: query
          required: false
          description: 榜单日期，格式 YYYY-MM-DD（昨天的日榜等）
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: 来源标记（网页内部参数）
          schema:
            type: string
        - name: p
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 排行榜（content 为作品数组，另有 mode/date/prev/next/page 等字段）
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    description: 榜单作品（旧版结构：title/rank/user_id/illust_id 等）
                    items:
                      type: object
                      additionalProperties: true
                  mode:
                    type: string
                  date:
                    type: string
                  prev:
                    type: integer
                    nullable: true
                    description: 上一页页码（无则 null）
                  next:
                    type: integer
                    nullable: true
                    description: 下一页页码（无则 null）
                  page:
                    type: integer
                additionalProperties: true

  /ajax/discovery/{type}:
    get:
      operationId: webDiscovery
      summary: 官网发现页推荐
      description: |
        官网 /discovery 的推荐流：每次返回一批新推荐，
        无 page/offset/next_url 分页（想要更多就再调一次）。
        type=artworks/novels/users 分别对应作品/小说/用户发现流。
        需要网页 Cookie。
      tags: [top-web]
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: 发现流类型
          schema:
            type: string
            enum: [artworks, novels, users]
        - name: mode
          in: query
          required: true
          description: 内容分级
          schema:
            type: string
            enum: [all, safe, r18]
        - name: limit
          in: query
          required: true
          description: 单次返回数量（网页默认 60）
          schema:
            type: integer
      responses:
        '200':
          description: 发现页推荐（recommended* 字段随 type 而异）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          tagTranslation:
                            $ref: '_shared.yaml#/components/schemas/WebTagTranslation'
                          thumbnails:
                            $ref: '_shared.yaml#/components/schemas/WebThumbnails'
                          users:
                            type: array
                            items:
                              $ref: '_shared.yaml#/components/schemas/WebUserItem'
                          recommendedIllusts:
                            type: array
                            description: type=artworks 时的推荐详情（illustId/score/seed 等）
                            items:
                              type: object
                              properties:
                                illustId:
                                  type: string
                                recommendMethods:
                                  type: array
                                  items:
                                    type: string
                                recommendScore:
                                  type: number
                                recommendSeedIllustIds:
                                  type: array
                                  items:
                                    type: string
                          recommendedNovelIds:
                            type: array
                            description: type=novels 时的推荐小说 ID
                            items:
                              type: string
                          recommendNovelDetails:
                            type: object
                            description: type=novels 时的推荐详情（键为小说 ID）
                            additionalProperties:
                              type: object
                          recommendedUsers:
                            type: array
                            description: type=users 时的推荐用户（userId/近期作品 ID 等）
                            items:
                              type: object
                              properties:
                                userId:
                                  type: string
                                recentIllustIds:
                                  type: array
                                  items:
                                    type: string
                                recentNovelIds:
                                  type: array
                                  items:
                                    type: string
                        additionalProperties: true

  /ajax/discovery/{type}/meta:
    get:
      operationId: webDiscoveryMeta
      summary: 官网发现页元信息
      description: |
        发现页（artworks/novels）的页面元信息与区域配置。
      tags: [top-web]
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: 发现流类型
          schema:
            type: string
            enum: [artworks, novels]
        - name: mode
          in: query
          required: true
          description: 内容分级
          schema:
            type: string
            enum: [all, safe, r18]
      responses:
        '200':
          description: 发现页元信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          zoneConfig:
                            $ref: '_shared.yaml#/components/schemas/WebZoneConfig'
                          meta:
                            type: object
                            properties:
                              title:
                                type: string
                              description:
                                type: string
                                description: 页面 description（可能为 false，即无值）
                            additionalProperties: true
                        additionalProperties: true

  /ajax/illust/discovery:
    get:
      operationId: webLegacyDiscovery
      summary: 官网发现页推荐（旧版）
      description: |
        旧版发现接口；无网页会话也能拉全年龄作品，每次最多 18 条。
      tags: [top-web]
      security: []
      parameters:
        - name: mode
          in: query
          required: true
          description: 内容分级（匿名时仅 safe 可用）
          schema:
            type: string
            enum: [all, safe, r18]
        - name: max
          in: query
          required: false
          description: 单次返回数量上限（默认 18）
          schema:
            type: integer
      responses:
        '200':
          description: 发现页推荐
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          illusts:
                            type: array
                            description: 精简作品列表
                            items:
                              type: object
                              additionalProperties: true
                        additionalProperties: true

  /ajax/follow_latest/{type}:
    get:
      operationId: webFollowLatest
      summary: 关注用户的新作品（Web 版）
      description: |
        网页版"关注最新"页面数据。与 App API 的 `/v2/illust/follow`、
        `/v1/novel/follow` 能力对应，但响应为 Web 结构（含分页 JSON）。
        需要登录 Cookie。
      tags: [top-web]
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: 作品类型
          schema:
            type: string
            enum: [illust, novels]
        - name: p
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
        - name: mode
          in: query
          required: false
          description: 内容分级过滤
          schema:
            type: string
            enum: [all, r18]
      responses:
        '200':
          description: 关注最新作品
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          page:
                            type: object
                            description: 分页信息（含下一页数据）
                            additionalProperties: true
                          thumbnails:
                            type: object
                            description: 作品缩略图数据（illust 字段为作品 map）
                            additionalProperties: true
                        additionalProperties: true
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'

  /ajax/mypixiv_latest/{type}:
    get:
      operationId: webMypixivLatest
      summary: 好 P 友（MyPixiv）的新作品（Web 版）
      description: |
        网页版「マイピク新着」页面数据：好 P 友（mypixiv，互关好友）
        的最新漫画/小说。与 App API 三件套（/v2/illust/mypixiv 等）
        同族。需要登录 Cookie。
      tags: [top-web]
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: 作品类型
          schema:
            type: string
            enum: [manga, novel]
        - name: p
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 好 P 友的新作品（与 follow_latest 同构：page + thumbnails）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          page:
                            type: object
                            description: 分页信息（含下一页数据）
                            additionalProperties: true
                          thumbnails:
                            type: object
                            description: 作品缩略图数据（illust/novel 字段为作品 map）
                            additionalProperties: true
                        additionalProperties: true
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'

  /ajax/user_event/portal/novels:
    get:
      operationId: webUserEventPortalNovels
      summary: 活动入口（小说征文等）
      description: |
        网页版小说区活动（user_event，征文企划等）入口页数据。
        App API 无对应能力。
      tags: [top-web]
      security: []
      parameters:
        - name: mode
          in: query
          required: false
          description: 内容分级过滤
          schema:
            type: string
        - name: p
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 活动入口数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_shared.yaml#/components/schemas/WebApiEnvelope'
                  - type: object
                    properties:
                      body:
                        type: object
                        properties:
                          page:
                            type: object
                            additionalProperties: true
                          tagTranslation:
                            $ref: '_shared.yaml#/components/schemas/WebTagTranslation'
                          thumbnails:
                            $ref: '_shared.yaml#/components/schemas/WebThumbnails'
                          users:
                            type: array
                            items:
                              $ref: '_shared.yaml#/components/schemas/WebUserItem'
                        additionalProperties: true
